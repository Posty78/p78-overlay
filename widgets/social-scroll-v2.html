<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width: 100%;
  height: 100%;
  background: transparent !important;
  overflow: hidden;
}
.viewport {
  width: 100%;
  height: 100%;
  overflow: hidden;
  position: relative;
}
.track {
  display: flex;
  flex-direction: column;
  animation: scroll-up 78s linear infinite;
  will-change: transform;
}
.card {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  width: 100%;
  height: var(--card-h, 90px);
  flex-shrink: 0;
}
.card img {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  flex-shrink: 0;
}
.card span {
  font-family: "Arial Black", Arial, sans-serif;
  font-size: 22px;
  font-weight: 900;
  color: #ffffff;
  white-space: nowrap;
  text-shadow:
    -2px -2px 0 #000,
     2px -2px 0 #000,
    -2px  2px 0 #000,
     2px  2px 0 #000,
     0px  2px 0 #000,
     0px -2px 0 #000,
     2px  0px 0 #000,
    -2px  0px 0 #000;
}
@keyframes scroll-up {
  from { transform: translateY(0); }
  to   { transform: translateY(-50%); }
}
</style>
</head>
<body>
<div class="viewport">
  <div class="track" id="track"></div>
</div>
<script>
document.documentElement.style.setProperty('--card-h', window.innerHeight + 'px');

const socials = [
  { url: 'kick.com/Posty78',          logo: 'https://www.google.com/s2/favicons?domain=kick.com&sz=64' },
  { url: 'tiktok.com/@kick.posty78',  logo: 'https://www.google.com/s2/favicons?domain=tiktok.com&sz=64' },
  { url: 'youtube.com/@Posty78vod',   logo: 'https://www.google.com/s2/favicons?domain=youtube.com&sz=64' },
  { url: 'instagram.com/posty.78',    logo: 'https://www.google.com/s2/favicons?domain=instagram.com&sz=64' },
  { url: 'x.com/posty_78',            logo: 'https://www.google.com/s2/favicons?domain=x.com&sz=64' },
  { url: 'facebook.com/kick.posty78', logo: 'https://www.google.com/s2/favicons?domain=facebook.com&sz=64' },
  { url: 'snapchat.com/@kick.posty78', logo: 'https://www.google.com/s2/favicons?domain=snapchat.com&sz=64' }
];

const track = document.getElementById('track');

function buildCard(s) {
  const c = document.createElement('div');
  c.className = 'card';
  c.innerHTML = '<img src="' + s.logo + '" alt=""/><span>' + s.url + '</span>';
  return c;
}

// Liste dupliquée deux fois pour une boucle parfaitement continue (translateY(-50%)).
[...socials, ...socials].forEach(s => track.appendChild(buildCard(s)));
</script>
</body>
</html>
