<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Test mobile - Compteur / Réservoir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: #000;
    min-height: 100vh;
    min-height: 100dvh;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 48px;
    padding: 40px 12px;
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
  }
  #reservoir-mount, #compteur-mount {
    transform: scale(1.3);
  }
</style>
</head>
<body>
<div id="reservoir-mount"></div>
<div id="compteur-mount"></div>

<script type="module">
  import * as jauge from "./js/elements/jauge.js?v=16";
  import * as reservoir from "./js/elements/reservoir.js?v=4";

  // Widgets reels de l'overlay, montes ici sans passer par le systeme de
  // scenes - juste pour verifier en conditions reelles (telephone en main
  // pendant la conduite) que la vitesse/l'essence remontent correctement,
  // sans avoir a ouvrir OBS.
  document.getElementById("compteur-mount").appendChild(jauge.create());
  document.getElementById("reservoir-mount").appendChild(reservoir.create());
</script>
</body>
</html>
